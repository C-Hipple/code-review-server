# Aggregates all language-specific CI checks into a single required status check.
# The "all-checks-passed" job is the one to require in branch protection rules.
# Language jobs run conditionally based on which files changed; skipped jobs are OK.
name: All Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Detect which parts of the codebase changed so we only run relevant checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      bun: ${{ steps.filter.outputs.bun }}
      rust: ${{ steps.filter.outputs.rust }}
      zig: ${{ steps.filter.outputs.zig }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/go.yml'
              - '.github/workflows/all-checks.yml'
            bun:
              - 'bun_client/**'
              - '.github/workflows/bun-client.yml'
              - '.github/workflows/all-checks.yml'
            rust:
              - 'tui_client/**'
              - '.github/workflows/rust.yml'
              - '.github/workflows/all-checks.yml'
            zig:
              - 'cmd/claude_review/**'
              - '.github/workflows/zig.yml'
              - '.github/workflows/all-checks.yml'
            docker:
              - 'Dockerfile'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'server/**'
              - 'workflows/**'
              - 'database/**'
              - 'config/**'
              - 'git_tools/**'
              - 'org/**'
              - 'utils/**'
              - 'bun_client/**'
              - '.github/workflows/docker.yml'
              - '.github/workflows/all-checks.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  bun-client:
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bun_client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui_client
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.14.0'

      - name: Build claude_review plugin
        run: zig build
        working-directory: cmd/claude_review

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: crs:latest

  # This is the single job to require in branch protection rules.
  # It succeeds when all language checks either passed or were skipped (no relevant changes).
  # It fails if any language check that ran returned a failure or was cancelled.
  all-checks-passed:
    needs: [go, bun-client, rust, zig, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all language checks passed
        run: |
          echo "Job results:"
          echo "  go:         ${{ needs.go.result }}"
          echo "  bun-client: ${{ needs.bun-client.result }}"
          echo "  rust:       ${{ needs.rust.result }}"
          echo "  zig:        ${{ needs.zig.result }}"
          echo "  docker:     ${{ needs.docker.result }}"

          for result in \
            "${{ needs.go.result }}" \
            "${{ needs.bun-client.result }}" \
            "${{ needs.rust.result }}" \
            "${{ needs.zig.result }}" \
            "${{ needs.docker.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "One or more language checks failed or were cancelled."
              exit 1
            fi
          done

          echo "All language checks passed or were skipped (no relevant changes)."
