name: Zig

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.filter.outputs.zig }}
    steps:
    - uses: actions/checkout@v4

    - uses: dorny/paths-filter@v1
      id: filter
      with:
        filters: |
          zig:
            - 'cmd/claude_review/**'
            - '.github/workflows/zig.yml'

  build:
    needs: check-changes
    if: needs.check-changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.14.0'

    - name: Build claude_review plugin
      run: zig build
      working-directory: cmd/claude_review
