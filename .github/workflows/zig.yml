name: Zig

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cmd/claude_review/**'
      - '.github/workflows/zig.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cmd/claude_review/**'
      - '.github/workflows/zig.yml'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.14.0'

    - name: Build claude_review plugin
      run: zig build
      working-directory: cmd/claude_review
