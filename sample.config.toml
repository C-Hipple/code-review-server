# Code Review Server Sample Configuration
# Copy this to ~/.config/codereviewserver.toml

# List of repositories to monitor
# Currently these are all matched to the workflow owner.
Repos = ["google/go-github", "pelletier/go-toml"]

# General Settings
JiraDomain = "your-domain.atlassian.net"
SleepDuration = 10 # Time to wait between updates (in minutes)
GithubUsername = "your-github-username"
RepoLocation = "~/" # Base directory where repos are cloned
AutoWorktree = false # Automatically manage worktrees for PRs
[SectionPriority]
"My Open PRs" = 10
"Needs My Team's Review" = 20
"Closed PRs" = 100


# Workflows define how PRs are gathered and displayed
[[Workflows]]
WorkflowType = "SyncReviewRequestsWorkflow"
Name = "My Open PRs"
Filters = ["FilterNotDraft"]
SectionTitle = "My Pull Requests"
IncludeDiff = true

[[Workflows]]
WorkflowType = "SingleRepoSyncReviewRequestsWorkflow"
Name = "Team Reviews"
Repo = "my-org/main-repo"
Teams = ["my-team", "my-other-team"]
SectionTitle = "Needs My Team's Review"

# AI features are off until enabled here (see docs/ai_features.md). Each one
# runs on a provider: "command" runs a program on this machine with the prompt
# on stdin, "gemini" calls the Gemini API with GEMINI_API_KEY, and
# "openrouter" calls any model OpenRouter serves with OPENROUTER_API_KEY. The
# first of these that is set picks it:
#   1. the feature's Provider         2. the feature's Command (-> "command")
#   3. [AI] DefaultProvider           4. [AI] DefaultCommand   (-> "command")
#   5. none of them: "gemini"
# An API key on its own never picks a provider.
# [AI]
# DefaultProvider = "command"   # or "gemini" / "openrouter"
# DefaultCommand = "claude -p"  # what the command provider runs
# DefaultModel = "anthropic/claude-sonnet-4.5"  # what openrouter asks for; a feature's Model beats it
#
# [[AIFeatures]]
# ID = "comments-addressed"
# Enabled = true
# Automatic = false
#
# [[AIFeatures]]
# ID = "feature-flags"     # is every change behind a feature flag / waffle switch?
# Enabled = true
# Automatic = true
# Mode = "agent"           # lets the model search the local clone for callers
#
# [[AIFeatures]]
# ID = "file-ordering"     # show each diff's files in reading order, tests last
# Enabled = true
# Automatic = true
#
# [[AIFeatures]]
# ID = "review-ease"       # rate each PR easy / medium / hard in the review list
# Enabled = true
# Automatic = true

# Plugins allow extending the server with custom checks
[[Plugins]]
Name = "Security Check"
Command = "security_check"  # Discover able on path with go install ./...
IncludeDiff = true
IncludeHeaders = true
IncludeComments = false

[[Plugins]]
Name = "Summarize"
Command = "summarize_diff"
IncludeDiff = true
IncludeHeaders = true
# The bundled LLM plugins call Gemini (GEMINI_API_KEY) unless told otherwise.
# To run one through OpenRouter (OPENROUTER_API_KEY) instead:
# Provider = "openrouter"
# Model = "anthropic/claude-sonnet-4.5"
IncludeComments = true
